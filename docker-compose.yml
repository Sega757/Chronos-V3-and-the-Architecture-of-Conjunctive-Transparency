version: '3.8'
services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER environment variable is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB environment variable is required}
    ports:
      - "127.0.0.1:5432:5432"

  go-metacore:
    build:
      context: ./go-metacore
    ports:
      - "127.0.0.1:50051:50051"
    depends_on:
      - db
    environment:
      - DB_DSN=postgres://${POSTGRES_USER:?POSTGRES_USER environment variable is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB environment variable is required}?sslmode=${POSTGRES_SSLMODE:-prefer}
      - METACORE_BIND_ADDR=0.0.0.0:50051

  python-worker:
    build:
      context: ./python-worker
    depends_on:
      - go-metacore
